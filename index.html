    return `<div class="hd">${DAYS[d]}${extra}</div>`;
  };
  let html=`<div class="wrap"><div class="grid" style="--H:${H}px;--n:${days.length};grid-template-columns:56px __COLS__;--cols:__PCOLS__"><div class="hd corner"></div>`;
  html+=days.map(hdr).join('');
  html+=`<div class="col time" style="height:calc(var(--H)*${total});background-image:none">`+
    Array.from({length:(t1-t0)/60+1},(_,i)=>`<span style="top:calc(var(--H)*${i})">${fmt(t0+i*60)}</span>`).join('')+'</div>';
  for(const d of days){
    const list=ev.filter(x=>x.d===d).sort((a,b)=>a.s-b.s||a.e-b.e);
    // overlap lanes
    let cluster=[],end=0;const place=[];
    const flush=()=>{const n=Math.max(...cluster.map(c=>c.lane))+1;cluster.forEach(c=>{c.ln=n});cluster=[]};
    for(const x of list){
      if(cluster.length&&x.s>=end)flush();
      const used=new Set(cluster.filter(c=>c.e>x.s).map(c=>c.lane));
      let l=0;while(used.has(l))l++;
      x.lane=l;cluster.push(x);end=Math.max(end,x.e);
    }
    if(cluster.length)flush();
    mx[d]=Math.max(...list.map(x=>x.ln));
    html+=`<div class="col" style="height:calc(var(--H)*${total})">`+list.map(x=>{
      const top=(x.s-t0)/60, h=(x.e-x.s)/60, w=100/x.ln;
      const sm=h<=0.5, nm=x.n||x.t, sub=[x.n?x.t:'',x.room].filter(Boolean).join(' · '), tm=fmt(x.s)+'–'+fmt(x.e), tmh='<bdi dir="ltr">'+tm+'</bdi>', ab=CUR.mode==='cls'?!!(x.who&&isAbs(x.d,x.who)):(CUR.self?isAbs(x.d,CUR.self):false);
      return `<div class="ev${sm?' sm':''}${ab?' abs-ev':''}" data-a="${esc(x.t)}" data-r="${esc(x.r||'')}" title="${esc(nm+' '+tm+' '+sub)}" style="--h:${hue(x.t)};top:calc(var(--H)*${top});height:calc(var(--H)*${h} - 2px);inset-inline-start:calc(${x.lane*w}% + 2px);width:calc(${w}% - 4px)"><b>${esc(nm)}</b>${ab?'<span class="tag">חסר/ה</span>':''}${sm?`<span>${tmh}</span>${sub?`<span>${esc(sub)}</span>`:''}`:tmh+(sub?`<small>${esc(sub)}</small>`:'')}${x.teacher?`<small>${esc(x.teacher)}</small>`:''}</div>`;
    }).join('')+'</div>';
  }
  return html.replace('__COLS__',days.map(d=>`minmax(${Math.max(130,(mx[d]||1)*105)}px,${mx[d]||1}fr)`).join(' ')).replace('__PCOLS__',days.map(d=>`minmax(0,${mx[d]||1}fr)`).join(' '))+'</div></div>';
}
function render(ev,who){
  LAST=[ev,who];
  const acts=[...new Set(ev.map(x=>x.t))];
  const lg=`<div class="lg">${acts.map(a=>`<span><i style="--h:${hue(a)}"></i>${esc(a)}</span>`).join('')}</div>`;
  let size='a4',limit=700;
  const draw=parts=>{
    PSIZE=size;
    $('out').innerHTML=parts.map((p,i)=>`<div class="part${size==='a3'?' a3':''}${i<parts.length-1?' brk':''}">`+(i===0?(who?`<div id="who">${esc(who)}</div>`:'')+lg+absPanel():(who?`<div class="whoc">${esc(who)}</div>`:''))+gridHtml(p)+'</div>').join('');
    fit();
  };
  const splitAt=L=>{
    const cand=[...new Set(L.flatMap(x=>[x.s,x.e]))].sort((a,b)=>a-b).filter(T=>!L.some(x=>x.s<T&&T<x.e)&&L.some(x=>x.e<=T)&&L.some(x=>x.s>=T));
    if(!cand.length){
      const D=[...new Set(L.map(x=>x.d))].sort((a,b)=>a-b);if(D.length<2)return null;
      let acc=0,cut=D[0];for(const d of D){acc+=L.filter(x=>x.d===d).length;if(acc>=L.length/2){cut=d;break}}
      if(cut===D[D.length-1])cut=D[D.length-2];
      return [L.filter(x=>x.d<=cut),L.filter(x=>x.d>cut)];
    }
    const mid=(Math.min(...L.map(x=>x.s))+Math.max(...L.map(x=>x.e)))/2;
    const T=cand.reduce((a,b)=>Math.abs(b-mid)<Math.abs(a-mid)?b:a);
    return [L.filter(x=>x.e<=T),L.filter(x=>x.s>=T)];
  };
  let parts=[ev];
  for(let k=0;;k++){
    draw(parts);
    if(!PRINTING||k>=5)break;
    const i=[...document.querySelectorAll('#out .part')].map(e=>e.offsetHeight).findIndex(h=>h>limit);
    if(i<0)break;
    if(size==='a4'&&parts.length===1){size='a3';limit=1000;continue;}
    const sp=splitAt(parts[i]);if(!sp)break;
    parts.splice(i,1,sp[0],sp[1]);
  }
}

function show(v,warn){
  v=String(v||'').trim();const p=DATA[v];
  if(!p){ if(warn){$('msg').textContent=v?'מספר עובד '+v+' לא נמצא.':'נא להזין מספר עובד.';$('out').innerHTML='';} return; }
  $('msg').textContent='';
  CUR={mode:'emp',self:p.n};refreshAbs();
  render(p.e.map(x=>({d:x[0],s:x[1],e:x[2],t:x[3],n:x[4],room:x[5],teacher:''})),'מערכת שעות: '+p.n+' ('+v+')');
}
$('num').addEventListener('input',e=>show(e.target.value,false));
$('num').addEventListener('keydown',e=>{if(e.key==='Enter')show($('num').value,true)});
$('go').onclick=()=>show($('num').value,true);
function showCls(v){const p=CLS[v];if(!p)return;$('msg').textContent='';CUR={mode:'cls',self:''};refreshAbs();
  render(p.e.map(x=>({d:x[0],s:x[1],e:x[2],t:x[3],n:x[4],room:x[5],teacher:'',r:x[6],who:x[5]})),'מערכת כיתה: '+p.n);}
function setMode(m){$('empBar').style.display=m==='emp'?'':'none';$('clsBar').style.display=m==='cls'?'':'none';$('mEmp').className=m==='emp'?'':'alt';$('mCls').className=m==='cls'?'':'alt';if(m==='emp')show($('num').value||'887',true);else showCls($('cls').value);}
$('mEmp').onclick=()=>setMode('emp');$('mCls').onclick=()=>setMode('cls');
$('cls').onchange=e=>showCls(e.target.value);$('goc').onclick=()=>showCls($('cls').value);
$('print').onclick=()=>window.print();
let BW=false;
const rr=()=>{if(LAST)render(LAST[0],LAST[1])};
$('bw').onclick=()=>{BW=!BW;document.body.classList.toggle('bw',BW);$('bw').textContent=BW?'חזרה לצבעוני':'תצוגת הדפסה שחור-לבן';PRINTING=BW;rr()};
window.addEventListener('beforeprint',()=>{if(!BW){document.body.classList.add('bw');PRINTING=true;rr()}});
window.addEventListener('afterprint',()=>{if(!BW){document.body.classList.remove('bw');PRINTING=false;rr()}});
$('num').value='887';show('887',true);
</script>
